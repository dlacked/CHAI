<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>CHAI</title>
</head>

<body>
    <div class="layout">
        <div class="main-area">
            <main>
                <section class="info-section" id="info-section">
                    <div class="info-display">
                        <span id="current-slice">Image: 0/0</span>
                        <span id="file-name">File: Not Opened</span>
                    </div>
                </section>

                <section class="visualization-section" id="visualization-section">
                    <div class="canvas-container" id="2d-container">
                        <div class="roi-wrapper">
                            <div class="roi-label">Oral Image</div>
                            <div class="image-wrapper">
                                <canvas id="raw-canvas"></canvas>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <nav class="sidebar">
            <div class="sidebar-header">MENU</div>
            <div class="sidebar-section">
                <label for="oral-image-input" class="sidebar-upload-btn">Open Oral Folder</label>
                <input type="file" id="oral-image-input" webkitdirectory directory multiple accept="image/*">
                <label for="oral-image-files" class="sidebar-upload-btn" style="margin-top: 10px;">Open Oral Images</label>
                <input type="file" id="oral-image-files" multiple accept="image/*" style="display:none;">
                <div id="oral-image-status" class="sidebar-status">No directory selected</div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-item">
                    <section>
                        <input type="checkbox" id="auto-all-checkbox">
                        <label for="auto-all-checkbox">Select All</label>
                    </section>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-label">2D VIEW</div>
                <div class="sidebar-item">
                    <section>
                        <input type="checkbox" id="jaw-classification-checkbox" disabled>
                        <label for="jaw-classification-checkbox">Jaw Classification</label>
                        <span id="jaw-classification-result" class="sidebar-status-inline"></span>
                    </section>
                    <section>
                        <input type="checkbox" id="yolov8-seg-checkbox">
                        <label for="yolov8-seg-checkbox">Tooth Segmentation</label>
                        <span id="yolo-segmentation-result" class="sidebar-status-inline"></span>
                    </section>
                    <section>
                        <input type="checkbox" id="pca-checkbox">
                        <label for="pca-checkbox">PCA</label>
                    </section>
                    <section>
                        <input type="checkbox" id="arch-path-checkbox">
                        <label for="arch-path-checkbox">Held-Karp DP</label>
                        <span id="arch-path-status" class="sidebar-status-inline"></span>
                    </section>
                    <section>
                        <input type="checkbox" id="gap-checkbox">
                        <label for="gap-checkbox">Segment Gap</label>
                        <span id="gap-status" class="sidebar-status-inline"></span>
                    </section>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-item">
                    <section>
                        <input type="checkbox" id="fdi-checkbox">
                        <label for="fdi-checkbox">FDI</label>
                        <span id="fdi-status" class="sidebar-status-inline"></span>
                    </section>
                </div>
            </div>
            <div class="sidebar-section sidebar-darkmode">
                <div class="sidebar-item">
                    <section>
                        <input type="checkbox" id="dark-mode-checkbox" checked>
                        <label for="dark-mode-checkbox">Dark Mode</label>
                    </section>
                </div>
            </div>
        </nav>
    </div>

    <script src="./js/dom.js"></script>
    <script src="./js/geometry.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
